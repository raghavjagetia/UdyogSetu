services:
  - type: web
    name: udyogsetu-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: UDYOGSETU_SECRET_KEY
        generateValue: true
      - key: UDYOGSETU_ALLOWED_ORIGINS
        value: "https://udyogsetu-web.onrender.com"

  - type: web
    name: udyogsetu-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://udyogsetu-api.onrender.com/api"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
